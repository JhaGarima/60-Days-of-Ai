<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supply Chain Builder</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg-0:#0a0c12;
    --bg-1:#0e1118;
    --panel:#12151f;
    --panel-2:#171b27;
    --panel-3:#1d2230;
    --border:rgba(255,255,255,0.07);
    --border-strong:rgba(255,255,255,0.14);
    --text-0:#eef1fa;
    --text-1:#b7bdd0;
    --text-2:#7d8399;
    --accent:#5b8cff;
    --accent-2:#8b5cf6;
    --good:#36d399;
    --warn:#fbbf24;
    --bad:#f87171;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-soft:0 8px 24px rgba(0,0,0,0.35);
    --shadow-glow:0 0 0 1px rgba(91,140,255,0.4), 0 8px 24px rgba(91,140,255,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 0%, rgba(91,140,255,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(139,92,246,0.10), transparent 45%),
      var(--bg-0);
    color:var(--text-0);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  .app-shell{
    max-width:1240px;
    margin:0 auto;
    padding:28px 24px 80px;
  }
  .top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-badge{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:var(--shadow-glow);
    flex-shrink:0;
  }
  .brand-title{font-size:18px;font-weight:700;letter-spacing:0.2px;}
  .brand-sub{font-size:12px;color:var(--text-2);margin-top:2px;}
  .pill{
    padding:6px 14px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-size:12px;
    color:var(--text-1);
    font-weight:600;
  }
  .fade-in{
    animation: fadeIn 0.45s ease both;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:24px;
    box-shadow:var(--shadow-soft);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card.hoverable:hover{
    transform:translateY(-3px);
    border-color:var(--border-strong);
    box-shadow:0 16px 34px rgba(0,0,0,0.45);
  }
  h1,h2,h3,h4{margin:0;}
  .section-title{
    font-size:22px;font-weight:800;margin-bottom:6px;
  }
  .section-sub{
    font-size:14px;color:var(--text-1);margin-bottom:18px;line-height:1.55;
  }
  .btn{
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    border-radius:var(--radius-sm);
    padding:12px 22px;
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    font-family:inherit;
  }
  .btn:active{transform:translateY(1px) scale(0.99);}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:white;
    box-shadow:0 8px 20px rgba(91,140,255,0.28);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(91,140,255,0.4);}
  .btn-ghost{
    background:var(--panel-2);
    color:var(--text-0);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{border-color:var(--border-strong); transform:translateY(-2px);}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:22px;}
  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:24px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .concept-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:18px 0 26px;
  }
  @media (max-width:760px){.concept-box{grid-template-columns:1fr;}}
  .concept-item{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px;
  }
  .concept-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:800;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .concept-label.what{color:var(--accent);}
  .concept-label.why{color:var(--warn);}
  .concept-label.effect{color:var(--good);}
  .concept-text{font-size:13.5px; color:var(--text-1); line-height:1.6;}

  .option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
  }
  .option-card{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px;
    cursor:pointer;
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
    position:relative;
  }
  .option-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 12px 26px rgba(91,140,255,0.18);
  }
  .option-card.selected{
    border-color:var(--accent);
    background:linear-gradient(160deg, rgba(91,140,255,0.14), rgba(139,92,246,0.10));
    box-shadow:var(--shadow-glow);
  }
  .option-title{font-size:15.5px; font-weight:800; margin-bottom:6px;}
  .option-desc{font-size:13px; color:var(--text-1); line-height:1.5; margin-bottom:10px;}
  .effect-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .effect-tag{
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    color:var(--text-1);
  }
  .effect-tag.pos{color:var(--good); background:rgba(54,211,153,0.12);}
  .effect-tag.neg{color:var(--bad); background:rgba(248,113,113,0.12);}

  .tradeoff-box{
    margin-top:20px;
    background:var(--panel-3);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-md);
    padding:18px 20px;
  }
  .tradeoff-title{
    font-size:13px;
    font-weight:800;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:8px;
  }
  .tradeoff-text{font-size:14px; color:var(--text-0); line-height:1.65;}

  .metrics-panel{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .metric-row{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 16px;
    transition:border-color .2s ease;
  }
  .metric-row:hover{border-color:var(--border-strong);}
  .metric-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .metric-name{font-size:13px; font-weight:700; color:var(--text-0);}
  .metric-value{font-size:13px; font-weight:800;}
  .metric-bar-track{
    height:9px;
    background:rgba(255,255,255,0.08);
    border-radius:6px;
    overflow:hidden;
  }
  .metric-bar-fill{
    height:100%;
    border-radius:6px;
    transition:width .9s cubic-bezier(.4,0,.2,1), background-color .5s ease;
  }
  .metric-status{font-size:11px; color:var(--text-2); margin-top:6px;}

  .progress-steps{
    display:flex;
    gap:8px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .step-dot{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    color:var(--text-2);
    padding:8px 14px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
  }
  .step-dot.active{
    color:white;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;
  }
  .step-dot.done{
    color:var(--good);
    border-color:rgba(54,211,153,0.4);
  }

  .company-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;
    margin:18px 0;
  }
  .company-stat{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 16px;
  }
  .company-stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-2); font-weight:700; margin-bottom:6px;}
  .company-stat-value{font-size:15px; font-weight:800; color:var(--text-0);}

  .hero{
    text-align:center;
    padding:50px 20px 30px;
  }
  .hero-emoji{font-size:54px; margin-bottom:10px;}
  .hero h1{font-size:34px; font-weight:900; margin-bottom:14px; background:linear-gradient(135deg,#fff,#aebfff); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{font-size:15.5px; color:var(--text-1); max-width:620px; margin:0 auto; line-height:1.7;}
  .explain-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin:32px 0;
  }
  .explain-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px;
    text-align:left;
  }
  .explain-card .e-icon{font-size:24px; margin-bottom:10px;}
  .explain-card h4{font-size:14.5px; margin-bottom:6px;}
  .explain-card p{font-size:13px; color:var(--text-1); line-height:1.55; margin:0;}

  .dash-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:880px){.dash-grid{grid-template-columns:1fr;}}
  .score-ring-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .score-ring{
    width:200px;height:200px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), rgba(255,255,255,0.08) 0);
    transition:background 1.1s ease;
  }
  .score-ring::before{
    content:"";
    position:absolute;
    width:158px;height:158px;
    border-radius:50%;
    background:var(--bg-1);
  }
  .score-inner{position:relative; text-align:center;}
  .score-num{font-size:42px; font-weight:900;}
  .score-label{font-size:12px; color:var(--text-2); font-weight:700; letter-spacing:0.05em; text-transform:uppercase;}
  .grade-badge{
    margin-top:14px;
    padding:6px 16px;
    border-radius:999px;
    font-weight:800;
    font-size:13px;
  }

  .list-block{margin:10px 0 18px;}
  .list-block h4{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-2);
    margin-bottom:10px;
    font-weight:800;
  }
  .list-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
    color:var(--text-0);
    line-height:1.55;
    margin-bottom:10px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .list-item .marker{flex-shrink:0; font-size:15px;}

  .risk-banner{
    background:linear-gradient(135deg, rgba(248,113,113,0.14), rgba(248,113,113,0.04));
    border:1px solid rgba(248,113,113,0.4);
    border-radius:var(--radius-md);
    padding:18px 20px;
    margin:14px 0;
  }
  .risk-banner h4{color:var(--bad); font-size:13px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px;}
  .risk-banner p{font-size:14px; color:var(--text-0); line-height:1.6; margin:0;}

  .footer-actions{
    display:flex;
    justify-content:center;
    margin-top:30px;
  }
  .small-note{font-size:12px; color:var(--text-2); text-align:center; margin-top:10px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */

const INDUSTRIES = [
  { name: "Electronics", icon: "💻", products: ["Wireless Earbuds", "Smart Home Hubs", "Laptop Chargers", "Bluetooth Speakers"] },
  { name: "Fashion & Apparel", icon: "👕", products: ["Sneakers", "Denim Jackets", "Activewear Sets", "Designer Handbags"] },
  { name: "Food & Beverage", icon: "🍫", products: ["Organic Snack Bars", "Cold-Brew Coffee", "Plant-Based Protein Powder", "Specialty Hot Sauces"] },
  { name: "Automotive Parts", icon: "🚗", products: ["Brake Pads", "Car Batteries", "Alloy Wheels", "Engine Sensors"] },
  { name: "Pharmaceuticals", icon: "💊", products: ["Pain Relief Tablets", "Vitamin Supplements", "Allergy Medication", "First-Aid Kits"] },
  { name: "Furniture", icon: "🛋️", products: ["Modular Sofas", "Standing Desks", "Bookshelves", "Outdoor Patio Sets"] },
  { name: "Toys & Games", icon: "🧸", products: ["Building Block Sets", "Remote-Control Cars", "Board Games", "Plush Animals"] },
  { name: "Cosmetics", icon: "💄", products: ["Vegan Lipsticks", "Anti-Aging Serums", "Organic Shampoo", "Mineral Sunscreen"] }
];

const COUNTRIES = ["United States","Canada","Mexico","Brazil","United Kingdom","Germany","France","Spain","Italy","India","China","Japan","South Korea","Australia","South Africa","UAE","Singapore","Vietnam","Indonesia","Nigeria"];

const NAME_PREFIXES = ["Nova","Orbit","Crestline","Lumen","Northpoint","Vertex","Bluepeak","Cascade","Ironwood","Solace","Driftway","Maple & Co","Granite","Horizon","Pinecrest"];
const NAME_SUFFIXES = ["Goods","Dynamics","Works","Industries","Collective","Group","Supply Co.","Logistics","& Sons","Manufacturing"];

const DEMAND_LEVELS = [
  { label: "Low", desc: "steady, predictable customer demand", baseline: { cost:55, speed:50, risk:60, satisfaction:55, sustainability:55 } },
  { label: "Medium", desc: "healthy, gradually growing customer demand", baseline: { cost:50, speed:50, risk:50, satisfaction:50, sustainability:50 } },
  { label: "High", desc: "strong, fast-growing customer demand", baseline: { cost:45, speed:45, risk:40, satisfaction:45, sustainability:48 } },
  { label: "Very High", desc: "explosive, viral customer demand", baseline: { cost:40, speed:42, risk:30, satisfaction:42, sustainability:45 } }
];

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickMany(arr, n){
  const copy = [...arr];
  const out = [];
  for(let i=0;i<n && copy.length>0;i++){
    const idx = Math.floor(Math.random()*copy.length);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}
function clamp(n){ return Math.max(0, Math.min(100, n)); }

function randomCompany(){
  const industry = pickRandom(INDUSTRIES);
  const product = pickRandom(industry.products);
  const numCountries = 3 + Math.floor(Math.random()*3); // 3-5
  const countries = pickMany(COUNTRIES, numCountries);
  const demand = pickRandom(DEMAND_LEVELS);
  const name = `${pickRandom(NAME_PREFIXES)} ${pickRandom(NAME_SUFFIXES)}`;
  return { name, industry: industry.name, icon: industry.icon, product, countries, demand };
}

/* ---------------------------------------------------------
   DECISIONS CONFIG
--------------------------------------------------------- */

const DECISIONS = [
  {
    key: "suppliers",
    title: "Choose Your Supplier Strategy",
    icon: "🏭",
    concept: {
      what: "A supplier is the company you buy raw materials or parts from. Your supplier strategy decides how many different suppliers you rely on to make your product.",
      why: "This is usually the very first link in any supply chain. If your suppliers can't deliver, nothing else downstream — factories, warehouses, customers — can happen either.",
      effect: "It sets the foundation for how cheap, fast, and resilient your entire operation will be later on."
    },
    options: [
      {
        id: "single",
        title: "Single Supplier",
        desc: "Work with just one trusted supplier for all your materials.",
        effects: { cost:12, speed:8, risk:-22, satisfaction:0, sustainability:-4 },
        tradeoff: "Sticking with one supplier is simple and usually cheaper because you can negotiate better deals and coordinate easily. But it's risky: if that single supplier has a fire, a strike, a bankruptcy, or even a bad month, your entire production line can grind to a halt. This is the classic 'don't put all your eggs in one basket' problem."
      },
      {
        id: "few",
        title: "A Few Suppliers (2-3)",
        desc: "Split your orders across two or three reliable suppliers.",
        effects: { cost:-4, speed:0, risk:12, satisfaction:6, sustainability:4 },
        tradeoff: "Spreading orders across a handful of suppliers costs a little more to manage, since you now have multiple relationships and contracts. In return, you gain real protection — if one supplier stumbles, the others can pick up the slack, keeping customers happier and your business steadier."
      },
      {
        id: "many",
        title: "Many Diversified Suppliers (4+)",
        desc: "Source from many suppliers across different regions and countries.",
        effects: { cost:-16, speed:-6, risk:22, satisfaction:8, sustainability:10 },
        tradeoff: "Maximum diversification gives you the strongest protection against disruption — a natural disaster or political issue in one region won't sink you. The trade-off is real complexity: more contracts, more communication, slightly slower coordination, and noticeably higher cost to manage so many relationships."
      }
    ]
  },
  {
    key: "factory",
    title: "Choose Your Factory Location",
    icon: "🏗️",
    concept: {
      what: "The factory location is where your product is physically manufactured or assembled.",
      why: "Distance to your factory affects how quickly materials can reach it and how quickly finished goods can leave it. Labor costs and regulations also vary hugely by country.",
      effect: "This choice influences your production costs, delivery speed to customers, and how exposed you are to overseas risks like shipping delays or trade restrictions."
    },
    options: [
      {
        id: "domestic",
        title: "Domestic Factory",
        desc: "Manufacture in the same country where most customers live.",
        effects: { cost:-12, speed:22, risk:10, satisfaction:10, sustainability:15 },
        tradeoff: "Manufacturing close to home means fast shipping, easier quality control, and fewer customs delays — great for speed and reliability. The downside is higher labor and facility costs, which eats into your profit margins compared to manufacturing overseas."
      },
      {
        id: "nearshore",
        title: "Nearshore Factory",
        desc: "Manufacture in a neighboring country, close but not domestic.",
        effects: { cost:0, speed:10, risk:6, satisfaction:5, sustainability:6 },
        tradeoff: "Nearshoring is a balanced middle ground: you get moderately lower costs than manufacturing at home, while keeping shipping times short and avoiding the long ocean crossings and time-zone headaches of far-away factories."
      },
      {
        id: "offshore",
        title: "Offshore Low-Cost Factory",
        desc: "Manufacture overseas in a country with much lower labor costs.",
        effects: { cost:22, speed:-18, risk:-16, satisfaction:-6, sustainability:-12 },
        tradeoff: "Offshore manufacturing dramatically lowers your production costs, which is why it's so popular. But it comes at a price: long shipping times, exposure to customs delays and trade policy changes, and a much bigger carbon footprint from cross-ocean freight."
      }
    ]
  },
  {
    key: "warehouse",
    title: "Choose Your Warehouse Strategy",
    icon: "📦",
    concept: {
      what: "A warehouse is where finished products are stored before they're shipped to customers or stores. Your strategy decides how many warehouses you have and where.",
      why: "Warehouses are the bridge between production and the customer. Too few, and deliveries take longer. Too many, and you're paying rent and staff for space you may not fully use.",
      effect: "This decision directly shapes how fast orders reach customers and how much you spend keeping inventory close to where it's needed."
    },
    options: [
      {
        id: "centralized",
        title: "Centralized Warehouse",
        desc: "One large warehouse that serves every market.",
        effects: { cost:16, speed:-12, risk:-6, satisfaction:-10, sustainability:4 },
        tradeoff: "A single big warehouse is cheap to run because you only manage one facility with economies of scale. But every order has to travel further to reach distant customers, slowing down delivery and frustrating customers who expect speed."
      },
      {
        id: "regional",
        title: "Regional Hub Warehouses",
        desc: "A handful of warehouses spread across major regions.",
        effects: { cost:0, speed:10, risk:6, satisfaction:10, sustainability:0 },
        tradeoff: "Regional hubs strike a healthy balance — orders travel shorter distances on average, improving speed and satisfaction, without the high overhead of running a warehouse in every single city."
      },
      {
        id: "decentralized",
        title: "Decentralized Local Warehouses",
        desc: "Many small warehouses placed close to customers everywhere.",
        effects: { cost:-16, speed:20, risk:4, satisfaction:14, sustainability:-10 },
        tradeoff: "Putting inventory right next to customers makes for extremely fast, satisfying deliveries. However, running many small facilities is expensive, and the extra short-haul trips between warehouses increase your overall environmental footprint."
      }
    ]
  },
  {
    key: "transport",
    title: "Choose Your Transportation Method",
    icon: "🚚",
    concept: {
      what: "Transportation is how goods physically move between suppliers, factories, warehouses, and customers — by road, rail, sea, or air.",
      why: "Each method trades speed for cost in a different way. Air is fast but expensive and polluting; sea is cheap but slow.",
      effect: "Your transportation choice has one of the biggest single impacts on both cost and delivery speed of anything in your supply chain."
    },
    options: [
      {
        id: "road",
        title: "Road Transport",
        desc: "Trucks moving goods over land, typically within a country or region.",
        effects: { cost:6, speed:6, risk:0, satisfaction:6, sustainability:-6 },
        tradeoff: "Trucking is flexible and reasonably quick for shorter distances, making it a dependable everyday choice. It's not the cheapest or greenest option at scale, but it's a safe, well-understood default."
      },
      {
        id: "rail",
        title: "Rail Transport",
        desc: "Trains moving large volumes of goods over land.",
        effects: { cost:10, speed:0, risk:6, satisfaction:0, sustainability:16 },
        tradeoff: "Rail is excellent for moving large quantities cheaply and with much lower emissions than trucks or planes. The catch is that trains run on fixed schedules and routes, so they're not as fast or flexible as road transport."
      },
      {

/* ---------------------------------------------------------
   SMALL HELPERS
--------------------------------------------------------- */

function statusForValue(v){
  if(v>=75) return { label:"Excellent", color:"var(--good)" };
  if(v>=55) return { label:"Good", color:"var(--good)" };
  if(v>=40) return { label:"Fair", color:"var(--warn)" };
  return { label:"Needs Attention", color:"var(--bad)" };
}

function MetricBar({ meta, value }){
  const [display, setDisplay] = useState(0);
  useEffect(()=>{
    const t = setTimeout(()=> setDisplay(value), 60);
    return ()=> clearTimeout(t);
  }, [value]);
  const status = statusForValue(value);
  return (
    <div className="metric-row">
      <div className="metric-top">
        <span className="metric-name">{meta.icon} {meta.label}</span>
        <span className="metric-value" style={{color: status.color}}>{Math.round(value)}</span>
      </div>
      <div className="metric-bar-track">
        <div className="metric-bar-fill" style={{ width: display + "%", backgroundColor: status.color }}></div>
      </div>
      <div className="metric-status">{status.label}</div>
    </div>
  );
}

function MetricsPanel({ metrics, title }){
  return (
    <div className="card">
      <h3 style={{fontSize:"15px", fontWeight:800, marginBottom:"4px"}}>{title || "Live Business Metrics"}</h3>
      <p style={{fontSize:"12.5px", color:"var(--text-2)", marginBottom:"16px", lineHeight:1.5}}>
        These update instantly as you make decisions, just like a real operations dashboard.
      </p>
      <div className="metrics-panel">
        {METRIC_META.map(m => <MetricBar key={m.key} meta={m} value={metrics[m.key]} />)}
      </div>
    </div>
  );
}

function effectTag(key, val){
  if(val === 0) return null;
  const meta = METRIC_META.find(m=>m.key===key);
  const sign = val > 0 ? "+" : "";
  const cls = val > 0 ? "pos" : "neg";
  return <span key={key} className={"effect-tag " + cls}>{meta.icon} {sign}{val}</span>;
}

function buildDashboardInsights(metrics, company, history){
  const score = Math.round(
    (metrics.cost + metrics.speed + metrics.risk + metrics.satisfaction + metrics.sustainability) / 5
  );

  const sorted = [...METRIC_META].sort((a,b) => metrics[b.key] - metrics[a.key]);
  const strengths = sorted.filter(m => metrics[m.key] >= 60).slice(0,2);
  const weaknesses = [...sorted].reverse().filter(m => metrics[m.key] <= 50).slice(0,2);

  const lowestMetric = [...METRIC_META].sort((a,b) => metrics[a.key] - metrics[b.key])[0];
  const biggestRisk = RISK_DESCRIPTIONS[lowestMetric.key];

  const weakestThree = [...METRIC_META].sort((a,b) => metrics[a.key] - metrics[b.key]).slice(0,3);
  const improvements = weakestThree.map(m => {
    const pool = IMPROVEMENT_POOL[m.key];
    return pool[Math.floor(Math.random()*pool.length)];
  });

  let grade = "C";
  let gradeColor = "var(--warn)";
  if(score >= 80){ grade = "A"; gradeColor = "var(--good)"; }
  else if(score >= 65){ grade = "B"; gradeColor = "var(--good)"; }
  else if(score >= 50){ grade = "C"; gradeColor = "var(--warn)"; }
  else { grade = "D"; gradeColor = "var(--bad)"; }

  return { score, strengths, weaknesses, biggestRisk, improvements, grade, gradeColor, lowestMetric };
}

/* ---------------------------------------------------------
   APP ROOT
--------------------------------------------------------- */

function App(){
  const [stage, setStage] = useState("welcome"); // welcome | company | decision | dashboard
  const [company, setCompany] = useState(null);
  const [metrics, setMetrics] = useState({ cost:50, speed:50, risk:50, satisfaction:50, sustainability:50 });
  const [decisionIndex, setDecisionIndex] = useState(0);
  const [selectedId, setSelectedId] = useState(null);
  const [phase, setPhase] = useState("choose"); // choose | explain
  const [history, setHistory] = useState([]);

  function handleStart(){
    const c = randomCompany();
    setCompany(c);
    setMetrics({ ...c.demand.baseline });
    setStage("company");
  }

  function handleBegin(){
    setDecisionIndex(0);
    setSelectedId(null);
    setPhase("choose");
    setHistory([]);
    setStage("decision");
  }

  function handleSelectOption(option){
    setSelectedId(option.id);
    setPhase("explain");
    setMetrics(prev => {
      const next = { ...prev };
      METRIC_META.forEach(m => {
        next[m.key] = clamp(prev[m.key] + (option.effects[m.key] || 0));
      });
      return next;
    });
  }

  function handleContinue(){
    const decision = DECISIONS[decisionIndex];
    const option = decision.options.find(o => o.id === selectedId);
    setHistory(prev => [...prev, { step: decision.title, choice: option.title }]);

    if(decisionIndex === DECISIONS.length - 1){
      setStage("dashboard");
    } else {
      setDecisionIndex(decisionIndex + 1);
      setSelectedId(null);
      setPhase("choose");
    }
  }

  function handleReplay(){
    setStage("welcome");
    setCompany(null);
    setMetrics({ cost:50, speed:50, risk:50, satisfaction:50, sustainability:50 });
    setDecisionIndex(0);
    setSelectedId(null);
    setPhase("choose");
    setHistory([]);
  }

  return (
    <div className="app-shell">
      <div className="top-bar">
        <div className="brand">
          <div className="brand-badge">📦</div>
          <div>
            <div className="brand-title">Supply Chain Builder</div>
            <div className="brand-sub">Learn supply chains by running your own company</div>
          </div>
        </div>
        {company && (
          <div className="pill">{company.icon} {company.name} · {company.demand.label} Demand</div>
        )}
      </div>

      {stage === "welcome" && <WelcomeScreen onStart={handleStart} />}
      {stage === "company" && company && (
        <CompanyScreen company={company} metrics={metrics} onBegin={handleBegin} />
      )}
      {stage === "decision" && company && (
        <DecisionScreen
          decisionIndex={decisionIndex}
          metrics={metrics}
          selectedId={selectedId}
          phase={phase}
          onSelect={handleSelectOption}
          onContinue={handleContinue}
        />
      )}
      {stage === "dashboard" && company && (
        <DashboardScreen metrics={metrics} company={company} history={history} onReplay={handleReplay} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
